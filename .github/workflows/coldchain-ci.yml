name: ColdChain CI

on:
  push:
    paths: ["coldchain/**", ".github/workflows/coldchain-ci.yml"]
  pull_request:
    paths: ["coldchain/**", ".github/workflows/coldchain-ci.yml"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coldchain/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coldchain/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, esp32s3, esp32dev-sim]
    defaults:
      run:
        working-directory: coldchain/firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('coldchain/firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: coldchain/firmware/.pio/build/${{ matrix.env }}/firmware.bin
