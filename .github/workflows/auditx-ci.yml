name: AuditX CI

on:
  push:
    paths: ["auditx-backend/**", "auditx-frontend/**", ".github/workflows/auditx-ci.yml"]
  pull_request:
    paths: ["auditx-backend/**", "auditx-frontend/**", ".github/workflows/auditx-ci.yml"]

jobs:
  backend:
    name: Backend tests (unit, integration, API, regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditx-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auditx
          POSTGRES_PASSWORD: auditx
          POSTGRES_DB: auditx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditx -d auditx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://auditx:auditx@127.0.0.1:5432/auditx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auditx-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the full suite with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            auditx-backend/pytest-report.xml
            auditx-backend/coverage.xml

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditx-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: auditx-frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
