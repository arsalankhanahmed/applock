; ColdChain sensor node firmware (ESP32, Arduino framework).
;   pio run -e esp32dev -t upload && pio device monitor
;   pio run -e esp32dev -t uploadfs        (not needed: the queue file is created on first boot)

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit SHT4x Library@1.0.5
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
build_flags =
    -D FW_VERSION=\"0.2.0\"

; Classic ESP32 DevKit (ESP32-WROOM-32): cheapest and most widely available in Pakistan.
[env:esp32dev]
board = esp32dev

; ESP32-S3 DevKitC: more RAM/flash, recommended for the production board.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D PIN_I2C_SDA=8
    -D PIN_I2C_SCL=9
    -D PIN_ONEWIRE=4
    -D PIN_BUZZER=5
    -D PIN_LED=2
    -D PIN_MAINS_SENSE=6
    -D PIN_BATTERY_ADC=7
    -D PIN_COOLING_RELAY=10

; Bench testing without sensors: sends generated fridge readings.
[env:esp32dev-sim]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D SIMULATE_SENSORS=1

; ESP32 DevKit + SIMCom A7670 (LTE Cat-1) modem: falls back to 4G when Wi-Fi is down (routers die with the
; mains). TLS runs in the modem. Libraries: TinyGSM (LGPL-3.0), ArduinoHttpClient (Apache-2.0).
[env:esp32dev-4g]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    vshymanskyy/TinyGSM@0.12.0
    arduino-libraries/ArduinoHttpClient@0.6.1
build_flags =
    ${env.build_flags}
    -D TINY_GSM_MODEM_A7672X
    -D TINY_GSM_RX_BUFFER=1024
