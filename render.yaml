# Render Blueprint: AuditX API on the free plan (eager background jobs, Neon PostgreSQL).
# Render -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: auditx-api
    runtime: docker
    plan: free
    dockerfilePath: ./auditx-backend/Dockerfile
    dockerContext: ./auditx-backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ROLE
        value: api
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_META_TOKEN
        sync: false
      - key: WHATSAPP_META_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: auditx_daily_alert
      - key: ALERTS_CRON_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JWT_SECRET
        generateValue: true
      - key: PARSER_CHUNK_ROWS
        value: "50000"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
