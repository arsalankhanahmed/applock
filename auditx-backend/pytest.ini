[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: isolated white-box tests of single functions (no database)
    integration: services working together against a real PostgreSQL
    api: black-box tests through the HTTP API only
    regression: pins a defect found earlier so it cannot come back
    slow: larger datasets; deselect with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
